<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan Sketcher</title>
<style>
  :root {
    --paper: #fbfcfe; --minor: #dde6f0; --major: #b4c6da; --ink: #1d2733;
    --bar: #f2f4f7; --bar-border: #d5dbe3; --btn: #ffffff; --btn-on: #2f6fd6; --muted: #5d6b7a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; color: var(--ink); background: var(--paper); overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 6px 8px; background: var(--bar); border-bottom: 1px solid var(--bar-border); z-index: 2; }
  .group { display: flex; gap: 4px; align-items: center; padding-right: 8px; border-right: 1px solid var(--bar-border); }
  .group:last-child { border-right: none; }
  button, select, input[type=number] { font: inherit; padding: 5px 9px; border: 1px solid var(--bar-border); border-radius: 6px; background: var(--btn); color: var(--ink); cursor: pointer; }
  input[type=number] { width: 58px; cursor: text; }
  button.on { background: var(--btn-on); border-color: var(--btn-on); color: #fff; }
  input[type=color] { width: 32px; height: 30px; padding: 1px; border: 1px solid var(--bar-border); border-radius: 6px; background: var(--btn); }
  label { color: var(--muted); display: flex; gap: 4px; align-items: center; }
  canvas { position: fixed; left: 0; display: block; touch-action: none; }
  #status { position: fixed; bottom: 0; left: 0; right: 0; padding: 4px 10px; font-size: 12px; color: var(--muted);
    background: var(--bar); border-top: 1px solid var(--bar-border); }
  #file { display: none; }
  .textedit { position: fixed; z-index: 3; min-width: 120px; padding: 0 3px; border: 1px dashed #2f6fd6; outline: none;
    background: rgba(255,255,255,0.92); line-height: 1.15; }
</style>
</head>
<body>
<div id="bar">
  <div class="group" id="tools">
    <button data-tool="select" title="Select and move (V)">Select</button>
    <button data-tool="line" class="on" title="Wall / line (L). Hold Shift for any angle.">Wall</button>
    <button data-tool="rect" title="Rectangle / room (R)">Room</button>
    <button data-tool="pen" title="Freehand (P)">Pen</button>
    <button data-tool="text" title="Text label (T)">Text</button>
    <button data-tool="fill" title="Fill a closed-in area, like the inside of a wall, with the current color (F)">Fill</button>
    <button data-tool="erase" title="Erase whatever you click (E)">Erase</button>
  </div>
  <div class="group">
    <input type="color" id="color" value="#1d2733" title="Color">
    <select id="width" title="Line weight">
      <option value="1">Thin</option><option value="2.5" selected>Medium</option><option value="5">Thick</option><option value="8">Wall</option>
    </select>
    <select id="tsize" title="Text size">
      <option value="1">Small text</option><option value="2" selected>Medium text</option><option value="3">Large text</option><option value="4.5">Huge text</option>
    </select>
  </div>
  <div class="group">
    <label>1 square = <input type="number" id="unit" value="1" min="0.01" step="0.25"></label>
    <select id="units"><option value="ft" selected>ft</option><option value="in">in</option><option value="m">m</option></select>
    <label>Snap <select id="snap" title="How far lines jump when snapping to the grid"><option value="1" selected>1 square</option><option value="0.5">1/2 square</option><option value="0.25">1/4 square</option></select></label>
    <button id="dims" class="on" title="Show lengths on walls and rooms">Measurements</button>
    <select id="nsize" title="Size of the measurement numbers">
      <option value="12">Small numbers</option><option value="16" selected>Medium numbers</option><option value="20">Large numbers</option><option value="26">Huge numbers</option>
    </select>
  </div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="clear">Clear</button>
  </div>
  <div class="group">
    <button id="save" title="Save the drawing as a file you can reopen (Ctrl+S)">Save</button>
    <button id="open" title="Open a saved drawing">Open</button>
    <button id="png" title="Export a picture">Export PNG</button>
    <input type="file" id="file" accept=".json,application/json">
  </div>
</div>
<canvas id="c"></canvas>
<div id="status">Drag to draw. Scroll to zoom, right-drag or Space+drag to pan. Everything snaps to the grid; hold Alt to draw off-grid.</div>

<script>
// Drawings are stored in grid units (1 = one square), so changing the scale
// relabels measurements without moving anything.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bar = document.getElementById('bar');
const statusEl = document.getElementById('status');
const STORE = 'plan-sketcher-v1';

let shapes = [];
let undoStack = [], redoStack = [];
let view = { s: 28, x: 40, y: 40 };   // pixels per square, screen offset of origin
let tool = 'line';
let showDims = true;
let draft = null, selected = null, drag = null, pan = null, spaceDown = false;

const $ = id => document.getElementById(id);

// ---------- persistence ----------
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (d) applyDoc(d);
  } catch (e) {}
}
function doc() {
  return { shapes, unit: +$('unit').value, units: $('units').value, snap: +$('snap').value, numSize: numSize(), view };
}
function applyDoc(d) {
  shapes = d.shapes || [];
  if (d.unit) $('unit').value = d.unit;
  if (d.units) $('units').value = d.units;
  if (d.snap) $('snap').value = d.snap;
  if (d.numSize) $('nsize').value = d.numSize;
  if (d.view) view = d.view;
  snapLabels();
}
function persist() {
  try { localStorage.setItem(STORE, JSON.stringify(doc())); } catch (e) {}
}
function commit() {
  undoStack.push(JSON.stringify(shapes));
  if (undoStack.length > 200) undoStack.shift();
  redoStack = [];
}

// ---------- geometry ----------
const toWorld = (px, py) => ({ x: (px - view.x) / view.s, y: (py - view.y) / view.s });
const toScreen = (wx, wy) => ({ x: wx * view.s + view.x, y: wy * view.s + view.y });
function snap(p, free) {
  if (free) return p;
  const step = +$('snap').value || 1;
  return { x: Math.round(p.x / step) * step, y: Math.round(p.y / step) * step };
}
function distSeg(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, L = dx * dx + dy * dy;
  let t = L ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function hitDist(s, p) {
  if (s.type === 'line') return distSeg(p, { x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 });
  if (s.type === 'rect') {
    const c = [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w, s.y + s.h], [s.x, s.y + s.h]].map(([x, y]) => ({ x, y }));
    return Math.min(...c.map((a, i) => distSeg(p, a, c[(i + 1) % 4])));
  }
  if (s.type === 'pen') {
    let m = Infinity;
    for (let i = 1; i < s.pts.length; i++) m = Math.min(m, distSeg(p, s.pts[i - 1], s.pts[i]));
    return m;
  }
  if (s.type === 'fill') {
    const cx = Math.floor((p.x - s.x) * s.r), cy = Math.floor((p.y - s.y) * s.r);
    return s.runs.some(([ry, rx, len]) => ry === cy && cx >= rx && cx < rx + len) ? 0 : Infinity;
  }
  if (s.type === 'text') {
    ctx.font = `${s.size * view.s}px system-ui, sans-serif`;
    const w = ctx.measureText(s.text).width / view.s;
    const inside = p.x >= s.x && p.x <= s.x + w && p.y >= s.y - s.size && p.y <= s.y + 0.2;
    return inside ? 0 : Infinity;
  }
  return Infinity;
}
function pick(p) {
  // Fills sit under everything, so a click picks a line or label before the fill beneath it.
  const tol = 8 / view.s;
  for (const fills of [false, true])
    for (let i = shapes.length - 1; i >= 0; i--)
      if ((shapes[i].type === 'fill') === fills && hitDist(shapes[i], p) <= tol) return shapes[i];
  return null;
}
function extent(s, add) {
  if (s.type === 'line') { add(s.x1, s.y1); add(s.x2, s.y2); }
  else if (s.type === 'rect') { add(s.x, s.y); add(s.x + s.w, s.y + s.h); }
  else if (s.type === 'pen') s.pts.forEach(q => add(q.x, q.y));
  else if (s.type === 'fill') s.runs.forEach(([ry, rx, len]) => { add(s.x + rx / s.r, s.y + ry / s.r); add(s.x + (rx + len) / s.r, s.y + (ry + 1) / s.r); });
  else { add(s.x, s.y - s.size); add(s.x + s.text.length * s.size * 0.6, s.y); }
}

// Paint-bucket fill: draw the outlines onto a hidden grid at FILL_RES cells
// per square, flood out from the click, and keep the result as row runs. If
// the flood reaches the edge of the drawing the area isn't closed in, so it
// is refused rather than painting everything.
const FILL_RES = 10;
let statusHold = 0;
function say(msg) { statusEl.textContent = msg; statusHold = Date.now() + 4000; }
function fillAt(p) {
  const outlines = shapes.filter(s => s.type === 'line' || s.type === 'rect' || s.type === 'pen');
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  outlines.forEach(s => extent(s, (x, y) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }));
  const open = 'That area is not closed in on all sides, so there is nothing to fill.';
  if (!(p.x > minX && p.x < maxX && p.y > minY && p.y < maxY)) return say(open);
  const x0 = Math.floor(minX) - 1, y0 = Math.floor(minY) - 1, R = FILL_RES;
  const W = (Math.ceil(maxX) + 1 - x0) * R, H = (Math.ceil(maxY) + 1 - y0) * R;
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const c = off.getContext('2d');
  const X = x => (x - x0) * R, Y = y => (y - y0) * R;
  c.lineWidth = 2; c.lineCap = 'square';
  c.beginPath();
  for (const s of outlines) {
    if (s.type === 'line') { c.moveTo(X(s.x1), Y(s.y1)); c.lineTo(X(s.x2), Y(s.y2)); }
    else if (s.type === 'rect') c.rect(X(s.x), Y(s.y), s.w * R, s.h * R);
    else s.pts.forEach((q, i) => i ? c.lineTo(X(q.x), Y(q.y)) : c.moveTo(X(q.x), Y(q.y)));
  }
  c.stroke();
  const wall = c.getImageData(0, 0, W, H).data;
  const mask = new Uint8Array(W * H);
  const start = Math.floor(Y(p.y)) * W + Math.floor(X(p.x));
  if (wall[start * 4 + 3]) return say('Click inside an area, not on a line.');
  const stack = [start];
  mask[start] = 1;
  while (stack.length) {
    const i = stack.pop(), x = i % W, y = (i - x) / W;
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) return say(open);
    for (const j of [i - 1, i + 1, i - W, i + W]) if (!mask[j] && !wall[j * 4 + 3]) { mask[j] = 1; stack.push(j); }
  }
  // Grow the fill under the outline so no gap shows between fill and line.
  for (let pass = 0; pass < 2; pass++) {
    const m = mask.slice();
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = y * W + x;
      if (!m[i] && (m[i - 1] || m[i + 1] || m[i - W] || m[i + W])) mask[i] = 1;
    }
  }
  const runs = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!mask[y * W + x]) continue;
      const sx = x;
      while (x < W && mask[y * W + x]) x++;
      runs.push([y, sx, x - sx]);
    }
  }
  commit();
  shapes.push({ type: 'fill', x: x0, y: y0, r: R, runs, color: $('color').value });
  persist(); render();
}
function move(s, dx, dy) {
  if (s.type === 'line') { s.x1 += dx; s.y1 += dy; s.x2 += dx; s.y2 += dy; }
  else if (s.type === 'pen') s.pts.forEach(q => { q.x += dx; q.y += dy; });
  else { s.x += dx; s.y += dy; }
}

// ---------- measurement labels ----------
// The snap menu names each step in real units too (at 4" a square: 4", 2", 1").
function snapLabels() {
  const names = { '1': '1 square', '0.5': '1/2 square', '0.25': '1/4 square' };
  for (const o of $('snap').options) o.textContent = `${names[o.value]} (${fmt(+o.value)})`;
}
function fmt(squares) {
  const u = $('units').value;
  const v = Math.abs(squares) * (+$('unit').value || 1) / (u === 'in' ? 12 : 1);
  if (u === 'm') return `${+v.toFixed(2)} m`;
  // Feet and inches both read as 1' 4"; under a foot is just 8".
  let ft = Math.floor(v), inch = Math.round((v - ft) * 12);
  if (inch === 12) { ft++; inch = 0; }
  if (!ft) return `${inch}"`;
  return inch ? `${ft}' ${inch}"` : `${ft}'`;
}
// Pieces 4" or shorter (wall thicknesses, end caps) get no label: there are
// dozens of them and their labels buried the real dimensions.
function tiny(squares) {
  const v = Math.abs(squares) * (+$('unit').value || 1), u = $('units').value;
  const inches = u === 'ft' ? v * 12 : u === 'm' ? v * 39.37 : v;
  return inches <= 4.01;
}
// Measurement numbers are a fixed screen size, set from the numbers menu, so
// they stay readable at any zoom.
function numSize() { return +$('nsize').value || 16; }
// Measurements are bold and take the color of the line they measure, so it
// is clear which number belongs to which line.
function label(text, x, y, angle = 0, color = '#2f6fd6') {
  ctx.save();
  ctx.translate(x, y);
  if (angle > Math.PI / 2 || angle < -Math.PI / 2) angle += Math.PI;
  ctx.rotate(angle);
  const px = numSize();
  ctx.font = `bold ${px}px system-ui, sans-serif`;
  const w = ctx.measureText(text).width + 8;
  ctx.fillStyle = 'rgba(251,252,254,0.9)';
  ctx.fillRect(-w / 2, -(px + 5), w, px + 3);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, 0, -6);
  ctx.restore();
}

// ---------- drawing ----------
function grid(W, H, s, ox, oy) {
  const x0 = Math.floor(-ox / s), x1 = Math.ceil((W - ox) / s);
  const y0 = Math.floor(-oy / s), y1 = Math.ceil((H - oy) / s);
  const every = s < 8 ? 10 : 1;   // when zoomed far out, skip minor lines
  ctx.lineWidth = 1;
  for (const major of [false, true]) {
    ctx.strokeStyle = major ? '#b4c6da' : '#dde6f0';
    ctx.beginPath();
    for (let i = x0; i <= x1; i++) {
      if (i % every) continue;
      if ((i % 10 === 0) !== major) continue;
      const x = Math.round(i * s + ox) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let j = y0; j <= y1; j++) {
      if (j % every) continue;
      if ((j % 10 === 0) !== major) continue;
      const y = Math.round(j * s + oy) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  }
}
function drawShape(s, v, isSel) {
  if (s.hidden) return;   // text being edited shows in the input box instead
  ctx.strokeStyle = ctx.fillStyle = s.color;
  ctx.lineWidth = s.lw;
  ctx.lineCap = ctx.lineJoin = 'round';
  const P = (x, y) => ({ x: x * v.s + v.x, y: y * v.s + v.y });
  if (s.type === 'line') {
    const a = P(s.x1, s.y1), b = P(s.x2, s.y2);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (isMeasure(s)) {
      // Dashed extension lines across each end, like a dimension on a plan.
      const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const ext = 0.6 * v.s;
      const nx = -(b.y - a.y) / len * ext, ny = (b.x - a.x) / len * ext;
      ctx.save();
      ctx.lineWidth = 1.5; ctx.lineCap = 'butt'; ctx.setLineDash([4, 3]);
      ctx.beginPath();
      for (const p of [a, b]) { ctx.moveTo(p.x - nx, p.y - ny); ctx.lineTo(p.x + nx, p.y + ny); }
      ctx.stroke();
      ctx.restore();
    }
    if (showDims && s === draft && !tiny(Math.hypot(s.x2 - s.x1, s.y2 - s.y1)))
      label(fmt(Math.hypot(s.x2 - s.x1, s.y2 - s.y1)), (a.x + b.x) / 2, (a.y + b.y) / 2 - s.lw / 2, Math.atan2(b.y - a.y, b.x - a.x), s.color);
  } else if (s.type === 'rect') {
    const a = P(s.x, s.y);
    ctx.strokeRect(a.x, a.y, s.w * v.s, s.h * v.s);
    if (showDims && s.w && s.h) {
      const x = Math.min(a.x, a.x + s.w * v.s), y = Math.min(a.y, a.y + s.h * v.s);
      if (!tiny(s.w)) label(fmt(s.w), x + Math.abs(s.w) * v.s / 2, y - s.lw / 2, 0, s.color);
      if (!tiny(s.h)) label(fmt(s.h), x - 4, y + Math.abs(s.h) * v.s / 2, -Math.PI / 2, s.color);
      if (Math.abs(s.w) * v.s > 70 && Math.abs(s.h) * v.s > 30) {
        const inches = $('units').value === 'in';
        const area = Math.abs(s.w * s.h) * Math.pow(+$('unit').value || 1, 2) / (inches ? 144 : 1);
        ctx.save(); ctx.font = `bold ${numSize()}px system-ui, sans-serif`; ctx.fillStyle = '#5d6b7a'; ctx.textAlign = 'center';
        ctx.fillText(`${+area.toFixed(1)} sq ${inches ? 'ft' : $('units').value}`, x + Math.abs(s.w) * v.s / 2, y + Math.abs(s.h) * v.s / 2 + 4);
        ctx.restore();
      }
    }
  } else if (s.type === 'pen') {
    ctx.beginPath();
    s.pts.forEach((q, i) => { const p = P(q.x, q.y); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
    ctx.stroke();
  } else if (s.type === 'fill') {
    const k = v.s / s.r, ox = v.x + s.x * v.s, oy = v.y + s.y * v.s;
    ctx.beginPath();
    for (const [ry, rx, len] of s.runs) ctx.rect(ox + rx * k, oy + ry * k, len * k, k + 0.6);   // overlap rows to hide seams
    ctx.fill();
  } else if (s.type === 'text') {
    const a = P(s.x, s.y);
    ctx.font = `${s.size * v.s}px system-ui, sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(s.text, a.x, a.y);
  }
  if (isSel) {
    ctx.save();
    ctx.strokeStyle = '#2f6fd6'; ctx.lineWidth = s.lw + 6; ctx.globalAlpha = 0.25;
    if (s.type === 'text') { ctx.font = `${s.size * v.s}px system-ui, sans-serif`; const a = P(s.x, s.y); ctx.strokeRect(a.x - 3, a.y - s.size * v.s, ctx.measureText(s.text).width + 6, s.size * v.s + 6); }
    else drawShape(Object.assign({}, s, { color: '#2f6fd6', lw: s.lw + 6 }), v, false);
    ctx.restore();
  }
}
// A red line is a measuring line: it gets dashed ends and sits on top of the
// walls it measures, so it is drawn in a second pass.
function isMeasure(s) {
  if (s.type !== 'line' || !/^#[0-9a-f]{6}$/i.test(s.color)) return false;
  const r = parseInt(s.color.slice(1, 3), 16), g = parseInt(s.color.slice(3, 5), 16), b = parseInt(s.color.slice(5, 7), 16);
  return r > 150 && g < 110 && b < 110;
}
// Lines that continue each other in a straight line get one label for the
// whole run instead of one per piece. Display only: the pieces stay separate
// so each can still be selected or erased. Runs only merge within one color,
// so a red measuring line laid over a black wall keeps its own number.
function lineLabels(v) {
  if (!showDims) return;
  const groups = new Map();
  for (const s of shapes) {
    if (s.type !== 'line' || s.hidden || s === draft) continue;
    let dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = Math.hypot(dx, dy);
    if (!len) continue;
    dx /= len; dy /= len;
    if (dx < -1e-9 || (Math.abs(dx) < 1e-9 && dy < 0)) { dx = -dx; dy = -dy; }
    const off = s.x1 * dy - s.y1 * dx;
    const key = [s.color, dx.toFixed(4), dy.toFixed(4), off.toFixed(4)].join();
    const a = s.x1 * dx + s.y1 * dy, b = s.x2 * dx + s.y2 * dy;
    if (!groups.has(key)) groups.set(key, { dx, dy, off, lw: s.lw, color: s.color, spans: [] });
    groups.get(key).spans.push([Math.min(a, b), Math.max(a, b)]);
  }
  for (const g of groups.values()) {
    g.spans.sort((p, q) => p[0] - q[0]);
    const runs = [];
    let cur = null;
    for (const sp of g.spans) {
      if (cur && sp[0] <= cur[1] + 1e-6) cur[1] = Math.max(cur[1], sp[1]);
      else runs.push(cur = sp.slice());
    }
    for (const [t0, t1] of runs) {
      if (tiny(t1 - t0)) continue;
      const tm = (t0 + t1) / 2;
      const x = tm * g.dx + g.off * g.dy, y = tm * g.dy - g.off * g.dx;
      label(fmt(t1 - t0), x * v.s + v.x, y * v.s + v.y - g.lw / 2, Math.atan2(g.dy, g.dx), g.color);
    }
  }
}
function drawAll(v, sel) {
  for (const s of shapes) if (s.type === 'fill') drawShape(s, v, s === sel);
  for (const s of shapes) if (s.type !== 'fill' && !isMeasure(s)) drawShape(s, v, s === sel);
  for (const s of shapes) if (isMeasure(s)) drawShape(s, v, s === sel);
  lineLabels(v);
}
function render() {
  const W = canvas.width / devicePixelRatio, H = canvas.height / devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#fbfcfe'; ctx.fillRect(0, 0, W, H);
  grid(W, H, view.s, view.x, view.y);
  drawAll(view, selected);
  if (draft) drawShape(draft, view, false);
}

function resize() {
  const top = bar.offsetHeight, bottom = statusEl.offsetHeight;
  const W = innerWidth, H = innerHeight - top - bottom;
  canvas.style.top = top + 'px';
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
  render();
}

// ---------- input ----------
function pointer(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function style() { return { color: $('color').value, lw: +$('width').value }; }

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const sp = pointer(e);
  if (e.button === 1 || e.button === 2 || spaceDown) { pan = { sx: sp.x, sy: sp.y, vx: view.x, vy: view.y }; return; }
  const raw = toWorld(sp.x, sp.y), p = snap(raw, e.altKey);
  if (tool === 'line') draft = { type: 'line', x1: p.x, y1: p.y, x2: p.x, y2: p.y, ...style() };
  else if (tool === 'rect') draft = { type: 'rect', x: p.x, y: p.y, w: 0, h: 0, ...style() };
  else if (tool === 'pen') draft = { type: 'pen', pts: [raw], ...style() };
  else if (tool === 'fill') fillAt(raw);
  else if (tool === 'text') {
    const hit = pick(raw);
    editText(hit && hit.type === 'text' ? hit : null, p);
  } else if (tool === 'erase') {
    const s = pick(raw);
    if (s) { commit(); shapes.splice(shapes.indexOf(s), 1); persist(); }
    drag = { erase: true };
  } else if (tool === 'select') {
    selected = pick(raw);
    if (selected) { commit(); drag = { last: p, moved: false }; }
  }
  render();
});
canvas.addEventListener('pointermove', e => {
  const sp = pointer(e), raw = toWorld(sp.x, sp.y), p = snap(raw, e.altKey);
  if (Date.now() > statusHold) statusEl.textContent = `x ${fmt(raw.x)}   y ${fmt(raw.y)}   zoom ${Math.round(view.s / 28 * 100)}%`;
  if (pan) { view.x = pan.vx + sp.x - pan.sx; view.y = pan.vy + sp.y - pan.sy; render(); return; }
  if (draft) {
    if (draft.type === 'line') {
      let x = p.x, y = p.y;
      if (!e.shiftKey) {   // lock to 0/45/90 degrees unless Shift is held
        const dx = x - draft.x1, dy = y - draft.y1;
        const ang = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
        const len = Math.hypot(dx, dy);
        const q = snap({ x: draft.x1 + Math.cos(ang) * len, y: draft.y1 + Math.sin(ang) * len }, e.altKey);
        if (Math.abs(Math.cos(ang)) < 1e-9) q.x = draft.x1;
        if (Math.abs(Math.sin(ang)) < 1e-9) q.y = draft.y1;
        x = q.x; y = q.y;
      }
      draft.x2 = x; draft.y2 = y;
    } else if (draft.type === 'rect') { draft.w = p.x - draft.x; draft.h = p.y - draft.y; }
    else if (draft.type === 'pen') draft.pts.push(raw);
    render();
  } else if (drag && drag.erase && e.buttons) {
    const s = pick(raw);
    if (s) { commit(); shapes.splice(shapes.indexOf(s), 1); persist(); render(); }
  } else if (drag && selected) {
    const dx = p.x - drag.last.x, dy = p.y - drag.last.y;
    if (dx || dy) { move(selected, dx, dy); drag.last = p; drag.moved = true; render(); }
  }
});
canvas.addEventListener('pointerup', () => {
  if (draft) {
    const empty = (draft.type === 'line' && draft.x1 === draft.x2 && draft.y1 === draft.y2)
      || (draft.type === 'rect' && (!draft.w || !draft.h)) || (draft.type === 'pen' && draft.pts.length < 2);
    if (!empty) {
      if (draft.type === 'rect') {   // normalize so x,y is always the top-left corner
        if (draft.w < 0) { draft.x += draft.w; draft.w = -draft.w; }
        if (draft.h < 0) { draft.y += draft.h; draft.h = -draft.h; }
      }
      commit(); shapes.push(draft); persist();
    }
    draft = null;
  }
  if (drag && selected && !drag.moved) undoStack.pop();   // a click without a move isn't an edit
  if (drag && drag.moved) persist();
  pan = null; drag = null;
  render();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const sp = pointer(e), w = toWorld(sp.x, sp.y);
  view.s = Math.max(3, Math.min(200, view.s * Math.exp(-e.deltaY * 0.0015)));
  view.x = sp.x - w.x * view.s; view.y = sp.y - w.y * view.s;
  persist(); render();
}, { passive: false });

// Text is typed in a box placed right on the drawing. Enter or clicking away
// keeps it, Escape cancels, and emptying an existing label deletes it.
let editing = null;
function editText(s, p) {
  finishText();
  const at = s ? { x: s.x, y: s.y } : p;
  const size = s ? s.size : +$('tsize').value;
  const sc = toScreen(at.x, at.y), r = canvas.getBoundingClientRect();
  const inp = document.createElement('input');
  inp.className = 'textedit';
  inp.value = s ? s.text : '';
  Object.assign(inp.style, {
    left: r.left + sc.x - 4 + 'px', top: r.top + sc.y - size * view.s * 1.05 + 'px',
    font: `${size * view.s}px system-ui, sans-serif`, color: s ? s.color : $('color').value,
  });
  document.body.appendChild(inp);
  if (s) { s.hidden = true; render(); }
  editing = { inp, s, at, size };
  inp.onkeydown = e => {
    e.stopPropagation();
    if (e.key === 'Enter') finishText();
    else if (e.key === 'Escape') finishText(true);
  };
  inp.onblur = () => { if (editing && editing.inp === inp) finishText(); };
  setTimeout(() => inp.focus());
}
function finishText(cancel) {
  if (!editing) return;
  const { inp, s, at, size } = editing;
  editing = null;
  inp.remove();
  const text = inp.value.trim();
  if (s) {
    delete s.hidden;
    if (!cancel && text !== s.text) {
      commit();
      if (text) s.text = text; else { shapes.splice(shapes.indexOf(s), 1); if (selected === s) selected = null; }
      persist();
    }
  } else if (!cancel && text) {
    commit();
    shapes.push({ type: 'text', x: at.x, y: at.y, text, size, color: $('color').value, lw: 1 });
    persist();
  }
  render();
}
canvas.addEventListener('dblclick', e => {
  const s = pick(toWorld(pointer(e).x, pointer(e).y));
  if (s && s.type === 'text' && tool === 'select') editText(s);
});
$('tsize').onchange = () => {
  if (selected && selected.type === 'text') { commit(); selected.size = +$('tsize').value; persist(); render(); }
};

function setTool(t) {
  finishText();
  tool = t; selected = null;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  canvas.style.cursor = t === 'select' ? 'default' : t === 'erase' ? 'not-allowed' : t === 'text' ? 'text' : t === 'fill' ? 'cell' : 'crosshair';
  render();
}
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(b.dataset.tool));

function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(shapes)); shapes = JSON.parse(undoStack.pop()); selected = null; persist(); render(); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(shapes)); shapes = JSON.parse(redoStack.pop()); selected = null; persist(); render(); }
$('undo').onclick = undo;
$('redo').onclick = redo;
$('clear').onclick = () => { if (shapes.length && confirm('Clear the whole drawing? (Undo can bring it back.)')) { commit(); shapes = []; selected = null; persist(); render(); } };
$('dims').onclick = () => { showDims = !showDims; $('dims').classList.toggle('on', showDims); render(); };
$('unit').oninput = $('units').onchange = () => { snapLabels(); persist(); render(); };
$('snap').onchange = persist;
$('nsize').onchange = () => { persist(); render(); };

function download(name, href) {
  const a = document.createElement('a'); a.href = href; a.download = name; a.click();
}
function save() {
  const name = (prompt('File name:', 'plan') || '').trim();
  if (!name) return;
  const url = URL.createObjectURL(new Blob([JSON.stringify(doc(), null, 1)], { type: 'application/json' }));
  download(name.replace(/\.json$/i, '') + '.json', url);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
$('save').onclick = save;
$('open').onclick = () => $('file').click();
$('file').onchange = async () => {
  const f = $('file').files[0]; if (!f) return;
  try { commit(); applyDoc(JSON.parse(await f.text())); selected = null; persist(); render(); }
  catch (e) { alert('That file is not a Plan Sketcher drawing.'); }
  $('file').value = '';
};
$('png').onclick = () => {
  // Export just the drawn area plus a margin, on the grid, at a fixed scale.
  if (!shapes.length) { alert('Nothing drawn yet.'); return; }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const add = (x, y) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); };
  for (const s of shapes) extent(s, add);
  const pad = 2, S = 30;
  minX = Math.floor(minX - pad); minY = Math.floor(minY - pad); maxX = Math.ceil(maxX + pad); maxY = Math.ceil(maxY + pad);
  const W = (maxX - minX) * S, H = (maxY - minY) * S;
  const saved = { w: canvas.width, h: canvas.height, view, sel: selected, dpr: devicePixelRatio };
  canvas.width = W * 2; canvas.height = H * 2;
  view = { s: S, x: -minX * S, y: -minY * S };
  selected = null;
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  grid(W, H, S, view.x, view.y);
  drawAll(view, null);
  const url = canvas.toDataURL('image/png');
  view = saved.view; selected = saved.sel;
  canvas.width = saved.w; canvas.height = saved.h;
  render();
  download('plan.png', url);
};

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); save(); return; }
  if (e.key === ' ') { spaceDown = true; canvas.style.cursor = 'grab'; e.preventDefault(); return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { commit(); shapes.splice(shapes.indexOf(selected), 1); selected = null; persist(); render(); return; }
  if (e.key === 'Escape') { draft = null; selected = null; render(); return; }
  const map = { v: 'select', l: 'line', w: 'line', r: 'rect', p: 'pen', t: 'text', f: 'fill', e: 'erase' };
  if (map[k] && !e.ctrlKey && !e.metaKey) setTool(map[k]);
});
addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; setTool(tool); } });
addEventListener('resize', resize);

load();
snapLabels();
setTool('line');
resize();
</script>
</body>
</html>
